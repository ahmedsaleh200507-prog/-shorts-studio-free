<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts Studio Free 3</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1322;color:#edf4ff;font:16px system-ui}main{max-width:620px;margin:auto;padding:20px}h1{color:#9de7d2}textarea{width:100%;min-height:160px;border:1px solid #59657c;border-radius:15px;background:#222c43;color:white;padding:15px;font:17px system-ui}button,select{border:0;border-radius:11px;padding:12px;background:#9de7d2;color:#09231d;font-weight:750}button{cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.controls label{display:flex;gap:8px;align-items:center}canvas{display:block;width:min(100%,360px);aspect-ratio:9/16;margin:20px auto;background:#14233a;border-radius:12px}#status{color:#a6e6d4;min-height:30px}a{color:#9de7d2}small{color:#a9b8d0;line-height:1.5;display:block}</style></head><body><main><h1>🎬 Shorts Studio Free 3</h1><p>Hikâyeni yaz. Her cümle ayrı hareketli sahne olur.</p><textarea id="story">Ein Mann wacht morgens auf. Er geht ins Badezimmer und putzt seine Zähne. Danach geht er in den Supermarkt. Er nimmt einen Apfel und bezahlt an der Kasse.</textarea><div class="controls"><label>Ses hızı <select id="speed"><option value="0.78">Yavaş</option><option value="1" selected>Normal</option><option value="1.2">Hızlı</option></select></label><label>Sahne <select id="duration"><option value="3">3 sn</option><option value="5" selected>5 sn</option><option value="7">7 sn</option></select></label></div><div class="controls"><button id="create">▶ Oluştur</button><button id="voice">🔊 Seslendir</button><button id="stop">■ Durdur</button><button id="save">🎥 Video kaydet</button></div><div id="status">Hazır</div><a id="download" hidden>Videoyu indir</a><canvas id="canvas" width="540" height="960"></canvas><small>Mikrofon kullanılmaz. Seslendirme cihazın yerleşik konuşma motoruyla yapılır. Tarayıcı desteğine göre video sessiz kaydedilebilir; sessiz kayıtta sesin MP4'e eklendiği iddia edilmez.</small></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),W=540,H=960;
let scenes=[],active=false,raf=0,started=0,sceneIndex=0,mode='',recorder=null,stream=null,recordChunks=[],recordTimer=null,speechUtterance=null,spokenIndex=-1,recording=false;
const status=s=>$('status').textContent=s;
const split=t=>(t.match(/[^.!?\n]+[.!?]?/gu)||[]).map(s=>s.trim()).filter(Boolean).slice(0,60);
function classify(sentence,previous){const q=sentence.toLowerCase();let place='city';if(/supermarkt|market|shop|laden|geschäft|apfel|kasse|einkauf|grocer/.test(q))place='market';else if(/badezimmer|zahn|dusche|bathroom|brush/.test(q))place='bath';else if(/schlaf|bett|aufwach|wake|bedroom/.test(q))place='bed';else if(/küche|kochen|essen|kitchen|cook/.test(q))place='kitchen';else if(/schule|unterricht|school|classroom/.test(q))place='school';else if(/krankenhaus|arzt|hospital|doctor/.test(q))place='hospital';else if(/wald|baum|forest|tree/.test(q))place='forest';else if(/büro|arbeit|office|work/.test(q))place='office';else if(/bus|zug|bahn|train|station/.test(q))place='station';else if(/weltall|planet|space|moon|mond/.test(q))place='space';else if(previous&&/^(er|sie|es|dann|danach|he|she|then|und)\b/.test(q))place=previous.place;let action=/zahn|putz|brush/.test(q)?'brush':/apfel|apple|nimmt|take/.test(q)?'take':/bezahl|kasse|pay/.test(q)?'pay':/schlaf|bett|sleep/.test(q)?'sleep':/geh|lauf|walk|go|fahrt|drive/.test(q)?'walk':'talk';return {text:sentence,place,action};}
function prepare(){const lines=split($('story').value);if(!lines.length){status('Önce metin yaz.');return false;}scenes=[];for(const line of lines)scenes.push(classify(line,scenes.at(-1)));sceneIndex=0;draw(scenes[0],0,0);status(`${scenes.length} sahne hazır.`);return true;}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function line(x,y,x2,y2,c,width=12){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}function txt(t,x,y,size=30,color='#fff'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}
function background(scene,t){let p=scene.place;const palettes={city:['#a8cfe5','#758ea7'],market:['#c8e8d8','#7d9b9b'],bath:['#c6e7ef','#8ca9b7'],bed:['#c9c8eb','#8e91b8'],kitchen:['#f0d5b7','#b5a08d'],school:['#f1deb6','#ad9983'],hospital:['#e4f2f4','#9eafb8'],forest:['#b1ddba','#699d79'],office:['#c9dce6','#8da1b3'],station:['#c8e1e8','#8298a4'],space:['#182441','#11182b']};let [sky,floor]=palettes[p]||palettes.city;rect(0,0,W,H,sky);rect(0,720,W,240,floor);if(p==='market'){for(let i=0;i<3;i++){let x=20+i*177;rect(x,275,150,430,'#5f8e7e');for(let j=0;j<4;j++){rect(x+8,315+j*98,134,13,'#bb936a');for(let k=0;k<3;k++)circle(x+30+k*42,296+j*98,17,'#e56e59')}}}else if(p==='bath'){rect(315,220,175,265,'#f8fafc');rect(330,235,145,210,'#8bc7df');rect(325,530,150,24,'#fff');rect(365,554,75,100,'#e6e9ec');circle(405,515,9,'#859baa')}else if(p==='bed'){rect(20,565,490,150,'#7384b3');rect(45,530,170,45,'#fff');rect(290,215,180,220,'#a4b5d5');rect(310,235,140,180,'#e6efff')}else if(p==='forest'){for(let i=0;i<6;i++){let x=40+i*100;rect(x,350,23,380,'#765c47');circle(x+10,340,80,'#498b5d')}}else if(p==='space'){for(let i=0;i<35;i++)circle((i*131)%540,(i*97)%730,2,'#fff');circle(420,270,115,'#527ec4')}else if(p==='station'){rect(20,320,500,260,'#9caeb5');for(let i=0;i<4;i++)rect(45+i*130,350,90,120,'#5e7c95');rect(0,705,540,18,'#f8d97b')}else if(p==='school'||p==='office'){rect(40,260,460,290,p==='school'?'#477969':'#708e9e');rect(65,590,400,35,'#a87f5e')}else if(p==='hospital'){rect(70,200,400,450,'#f6f9fa');rect(245,235,50,140,'#df6970');rect(200,280,140,50,'#df6970')}else if(p==='kitchen'){rect(20,315,500,310,'#d3b69b');rect(40,350,150,220,'#eee7d9');rect(310,350,170,220,'#eee7d9')}else{for(let i=0;i<4;i++){let x=i*145-10;rect(x,370+(i%2)*75,130,350,'#9eabbc');for(let j=0;j<3;j++)rect(x+40,420+j*75+(i%2)*75,48,40,'#e7f1fb')}}}
function character(scene,t){let walk=scene.action==='walk'?Math.sin(t*9)*24:Math.sin(t*4)*6;let x=270+(scene.action==='walk'?Math.sin(t*1.2)*45:0),y=530+Math.sin(t*4)*5;line(x-20,y+170,x-28+walk,y+350,'#293952',27);line(x+20,y+170,x+28-walk,y+350,'#293952',27);rect(x-47,y-10,94,190,'#4387b0');line(x-45,y+15,x-95,y+145+walk,'#293952',23);line(x+45,y+15,x+96,y+145-walk,'#293952',23);circle(x,y-70,55,'#e8b28f');circle(x-18,y-77,4,'#273346');circle(x+18,y-77,4,'#273346');if(scene.action==='brush'){line(x+45,y+15,x+20,y-52,'#293952',22);rect(x+8,y-66,35,7,'#f8f8ff')}if(scene.action==='take'||scene.action==='pay'){circle(x+95,y+125-walk,22,scene.action==='take'?'#e33f3f':'#e4c76b')}if(scene.action==='sleep'){txt('Z z z',x+100,y-120,36,'#384a7b')}}
function wrapCaption(text){ctx.font='bold 31px system-ui';const words=text.split(/\s+/),lines=[];let cur='';for(let word of words){let next=cur?cur+' '+word:word;if(ctx.measureText(next).width>490&&cur){lines.push(cur);cur=word}else cur=next;}if(cur)lines.push(cur);return lines.slice(0,4)}
function draw(scene,t,progress){if(!scene)return;ctx.clearRect(0,0,W,H);ctx.save();let zoom=1+0.015*Math.sin(t*.7);ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);background(scene,t);character(scene,t);ctx.restore();rect(0,818,540,142,'#0d1527');const lines=wrapCaption(scene.text);lines.forEach((l,i)=>txt(l,270,857+i*35,30));rect(0,951,540*Math.max(0,Math.min(1,progress)) ,9,'#9de7d2');}
function frame(now){if(!active)return;const seconds=(now-started)/1000,per=Number($('duration').value),idx=Math.floor(seconds/per);if(idx>=scenes.length){stopAll(false);status('Önizleme tamamlandı.');return;}sceneIndex=idx;draw(scenes[idx],seconds,seconds/per-idx);raf=requestAnimationFrame(frame)}
function stopSpeech(){if('speechSynthesis'in window){speechSynthesis.cancel();speechUtterance=null;spokenIndex=-1}}
function stopAll(abortRecording=true){active=false;cancelAnimationFrame(raf);stopSpeech();if(abortRecording&&recording&&recorder&&recorder.state!=='inactive')recorder.stop();if(recordTimer){clearTimeout(recordTimer);recordTimer=null;}if(!recording)status('Durduruldu.');}
function lang(){const t=$('story').value;return /[äöüß]|\b(ein|eine|der|die|das|und|geht|ist)\b/i.test(t)?'de-DE':/[çğıİşöü]|\b(bir|ve|sonra)\b/i.test(t)?'tr-TR':'en-US'}
function sayAt(i){if(!active||mode!=='speech'||i>=scenes.length){if(mode==='speech'){active=false;status('Seslendirme tamamlandı.')}return;}spokenIndex=i;sceneIndex=i;const u=new SpeechSynthesisUtterance(scenes[i].text);speechUtterance=u;u.lang=lang();u.rate=Number($('speed').value);u.onstart=()=>{started=performance.now();const tick=now=>{if(!active||mode!=='speech'||spokenIndex!==i)return;draw(scenes[i],(now-started)/1000,Math.min(1,(now-started)/1000/Math.max(2,Number($('duration').value))));raf=requestAnimationFrame(tick)};cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)};u.onend=()=>{if(active&&mode==='speech')sayAt(i+1)};u.onerror=e=>{active=false;status('Seslendirme hatası: '+e.error)};speechSynthesis.speak(u)}
$('create').onclick=()=>{stopAll();if(!prepare())return;mode='preview';active=true;started=performance.now();raf=requestAnimationFrame(frame);status('Hareketli önizleme oynuyor.')};
$('voice').onclick=()=>{stopAll();if(!prepare())return;if(!('speechSynthesis'in window)){status('Bu tarayıcı seslendirmeyi desteklemiyor.');return;}mode='speech';active=true;status('Seslendirme başladı. Mikrofon kullanılmıyor.');sayAt(0)};
$('stop').onclick=()=>{stopAll();status('Durduruldu.')};
function chooseMime(){const types=['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4;codecs="avc1.42E01E"','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];return types.find(x=>MediaRecorder.isTypeSupported(x))||''}
$('save').onclick=async()=>{if(recording)return;stopAll();if(!prepare())return;if(!canvas.captureStream||!window.MediaRecorder){status('Bu tarayıcı doğrudan video kaydını desteklemiyor. Safari veya güncel Chrome deneyin.');return;}const mime=chooseMime();if(!mime){status('Bu tarayıcıda uygun video formatı bulunamadı.');return;}try{stream=canvas.captureStream(30);recordChunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3500000});recording=true;$('save').disabled=true;$('download').hidden=true;const ext=mime.includes('mp4')?'mp4':'webm';recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onerror=()=>status('Video kaydı sırasında hata oluştu.');recorder.onstop=()=>{recording=false;$('save').disabled=false;active=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());if(recordChunks.length){const blob=new Blob(recordChunks,{type:mime});const url=URL.createObjectURL(blob),a=$('download');if(a.href.startsWith('blob:'))URL.revokeObjectURL(a.href);a.href=url;a.download='shorts-studio.'+ext;a.hidden=false;a.textContent='Videoyu indir ('+ext.toUpperCase()+')';status('Kayıt hazır: '+ext.toUpperCase()+' (sessiz). Mikrofon kullanılmadı.')}else status('Video dosyası oluşturulamadı.')};recorder.start(250);mode='record';active=true;started=performance.now();const duration=scenes.length*Number($('duration').value)*1000;const tick=now=>{if(!active||!recording)return;const elapsed=Math.min(duration,now-started),idx=Math.min(scenes.length-1,Math.floor(elapsed/(Number($('duration').value)*1000)));draw(scenes[idx],elapsed/1000,(elapsed%(Number($('duration').value)*1000))/(Number($('duration').value)*1000));if(elapsed<duration)raf=requestAnimationFrame(tick);else{active=false;setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},150)}};raf=requestAnimationFrame(tick);recordTimer=setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},duration+2500);status('Video kaydediliyor (sessiz). Mikrofon izni istenmez.')}catch(e){recording=false;$('save').disabled=false;stream?.getTracks().forEach(t=>t.stop());status('Kayıt başlatılamadı: '+e.message)}};
prepare();
</script></body></html>
