function caption(text){

$('voice').onchange=()=>{resetPlayback();status('Ses seçildi. Başlat düğmesine bas.')};
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,400);setTimeout(loadVoices,1500)}else $('voice').innerHTML='<option>Seslendirme desteklenmiyor</option>';
function mime(){if(!window.MediaRecorder)return'';return ['video/mp4;codecs="avc1.42E01E"','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||''}

const WORKER='https://shorts-studio-free.ahmed-saleh2005.workers.dev';
let audioBusy=false;
const audioStatus=s=>$('audioStatus').textContent=s;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function api(path,key,options={}){
 const response=await fetch(WORKER+path,{...options,headers:{'x-app-key':key,...(options.headers||{})}});
 if(!response.ok){let message='HTTP '+response.status;try{const body=await response.json();message=body.error||message;if(body.github_status)message+=' (GitHub '+body.github_status+')'}catch(e){}throw Error(message)}
 return response;
}
$('audioSave').onclick=async()=>{
 if(audioBusy)return;
 const script=$('story').value.trim(),key=$('appkey').value.trim();
 if(!script){audioStatus('Önce metin yaz.');return}
 if(script.length>3000){audioStatus('En fazla 3000 karakter yaz.');return}
 if(!window.JSZip){audioStatus('İndirme kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.');return}
 if(!key){audioStatus('Kaydetmek için Cloudflare APP_KEY değerini girmen gerekiyor. Şifreyi unuttuysan Cloudflare Settings bölümünden yenisini oluştur.');$('appkey').focus();return}
 audioBusy=true;$('audioSave').disabled=true;$('audioDownload').hidden=true;$('audioDownload').setAttribute('aria-hidden','true');
 try{
  audioStatus('Sesli video işi başlatılıyor...');
  const response=await api('/render',key,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({script,language:$('language').value.startsWith('de')?'de':'en'})});
  const job=await response.json();if(!job.job_id)throw Error('İş kimliği alınamadı');
  let runId=null;
  for(let attempt=0;attempt<100;attempt++){
   await delay(6000);
   const res=await api('/status?job_id='+encodeURIComponent(job.job_id),key),state=await res.json();
   audioStatus('Sesli MP4: '+(state.status||'bekleniyor')+' ('+(attempt+1)+')');
   if(state.status==='completed'){
    if(state.conclusion!=='success')throw Error('GitHub üretimi başarısız: '+(state.conclusion||'bilinmiyor'));
    runId=state.run_id;break;
   }
  }
  if(!runId)throw Error('İşlem zaman aşımına uğradı.');
  audioStatus('Sesli MP4 indiriliyor...');
  const zip=await api('/artifact?run_id='+encodeURIComponent(runId),key);
  if(!window.JSZip)throw Error('ZIP açma kütüphanesi yüklenemedi.');
  const archive=await JSZip.loadAsync(await zip.arrayBuffer());
  const entry=Object.values(archive.files).find(file=>!file.dir&&file.name.toLowerCase().endsWith('.mp4'));
  if(!entry)throw Error('Arşivde MP4 bulunamadı.');
  const bytes=await entry.async('blob'),url=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));
  const a=$('audioDownload');if(a.dataset.url)URL.revokeObjectURL(a.dataset.url);
  a.dataset.url=url;a.href=url;a.download='shorts-studio-sesli.mp4';a.hidden=false;a.removeAttribute('aria-hidden');
  a.click();
  audioStatus('Sesli MP4 hazır. iPhone indirmeyi açmazsa aşağıdaki İndirme bağlantısına dokun.');
 }catch(error){audioStatus('Hata: '+error.message+(error.message==='Unauthorized'?' — Cloudflare APP_KEY ile buraya yazdığın değer eşleşmiyor.':'')+(error.message==='Origin not allowed'?' — Cloudflare ALLOWED_ORIGIN ayarını kontrol et.':''))}
 finally{audioBusy=false;$('audioSave').disabled=false}
};
prepare();controls();
</script></body></html>
