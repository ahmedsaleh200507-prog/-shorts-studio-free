<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts Studio Free — Sesli MP4</title>
<style>
:root{color-scheme:dark;--bg:#070c18;--panel:#111c30;--line:#31405a;--muted:#a8bdd5;--mint:#84f0d0;--white:#f5f8ff}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#172d49 0%,transparent 55%),linear-gradient(165deg,#090f1d,#080d19 75%);color:var(--white);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:1080px;margin:auto;padding:clamp(16px,3vw,36px) max(16px,env(safe-area-inset-right)) 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,360px);gap:0 28px;align-items:start}
h1{grid-column:1/-1;font-size:clamp(27px,5vw,42px);line-height:1.1;letter-spacing:-.035em;margin:10px 0 4px;color:#e9fff7}
h1+p{grid-column:1/-1;margin:4px 0 25px;color:var(--muted);font-size:15px}
textarea{grid-column:1;display:block;width:100%;height:210px;min-height:170px;resize:vertical;background:linear-gradient(160deg,#16243b,#101a2e);color:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px;font:16px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;box-shadow:0 14px 40px #0003}
textarea:focus,input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
button,select,input{font:inherit}button,select{border:1px solid transparent;border-radius:14px;padding:13px 17px;font-weight:700}
button{background:var(--mint);color:#06251e;cursor:pointer;min-height:48px;transition:transform .15s,filter .15s}button:active{transform:scale(.98)}button:hover:not(:disabled){filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}
#reset{background:#23334b;color:#e5efff;border-color:#3a4d69}
#audioSave{width:100%;font-size:17px;min-height:58px;background:linear-gradient(110deg,#78e6c9,#a7f5df);box-shadow:0 10px 35px #42e0b126}
select,input{background:#182840;color:#fff;width:100%;border:1px solid #3c506e}
.row{grid-column:1;display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.field{display:grid;gap:7px;flex:1;min-width:145px}.field label{font-size:13px;font-weight:700;color:#c3d6ed}
canvas,#renderedVideo{grid-column:2;grid-row:3/span 8;display:block;width:100%;max-width:360px;aspect-ratio:9/16;margin:0 auto 18px;background:#14233a;border:6px solid #253750;border-radius:27px;box-shadow:0 22px 70px #0009}
#renderedVideo{display:block;width:100%;max-width:360px;aspect-ratio:9/16;margin:0 auto 18px;background:#101a2e;border:6px solid #253750;border-radius:27px;box-shadow:0 22px 70px #0009;object-fit:contain}\n[hidden]{display:none!important}\n#status,#audioStatus{grid-column:1;min-height:26px;color:var(--mint);overflow-wrap:anywhere;font-size:14px}
#audioStatus:not(:empty){background:#142a33;border:1px solid #285b5d;border-radius:12px;padding:12px 14px;margin:5px 0}
#audioDownload{grid-column:1;color:#081f19;background:var(--mint);font-weight:700;border-radius:12px;padding:12px 18px;text-align:center;text-decoration:none;margin:8px 0}
small{grid-column:1;color:#a5b8cf;line-height:1.6;display:block;margin-top:12px}
[hidden]{display:none!important}
@media(max-width:760px){main{display:flex;flex-direction:column;gap:0;padding:18px 16px calc(35px + env(safe-area-inset-bottom))}h1{margin-top:6px}h1+p{margin-bottom:18px}textarea{height:175px}main>.row{width:100%}canvas,#renderedVideo{order:7;width:min(100%,330px);margin:18px auto}#status{order:6}#audioStatus{order:4;width:100%}#audioDownload{order:5;width:100%}small{order:8}#toggle,#reset{flex:1}#audioSave{width:100%}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head>
<body><main><h1>🎬 Shorts Studio <span style="color:#84f0d0">Free</span></h1><p>2D hikâyeni yaz · Sesli önizle · 9:16 MP4 olarak kaydet</p>
<textarea id="story" maxlength="3000" aria-label="Video senaryosu">Ein Mann wacht morgens auf. Er geht ins Badezimmer und putzt seine Zähne. Danach geht er in den Supermarkt. Er nimmt einen Apfel und bezahlt an der Kasse.</textarea>
<div class="row"><div class="field"><label for="language">Ses dili</label><select id="language"><option value="de-DE">🇩🇪 Almanca</option><option value="en-US">🇬🇧 İngilizce</option></select></div><div class="field"><label for="voice">Cihazdaki ses</label><select id="voice"><option value="">Sesler yükleniyor...</option></select></div></div>
<div class="row"><button id="toggle">▶ Başlat</button><button id="reset">↺ Baştan</button></div>
<div class="row"><div class="field"><label for="appkey">Cloudflare APP_KEY (özel)</label><input id="appkey" type="password" autocomplete="off" placeholder="APP_KEY değerini gir" style="width:100%;padding:13px;background:#1e2a42;color:white;border:1px solid #667b96;border-radius:12px"></div></div><div class="row"><button id="audioSave">📥 Videoyu kaydet</button></div><div id="audioStatus" role="status" aria-live="polite"></div><a id="audioDownload" hidden aria-hidden="true">📥 MP4 dosyasını indir</a><div id="status" role="status">Hazır.</div><canvas id="canvas" width="540" height="960"></canvas><video id="renderedVideo" hidden playsinline controls preload="metadata" aria-label="Oluşturulan gerçek sesli MP4 önizlemesi"></video>
<small>▶ Başlat ve 📥 Videoyu kaydet aynı MP4 üretimini başlatır. Oluşturulan gerçek video önizlemede gösterilir. Cloudflare APP_KEY değeri gerekir; GitHub tokenını buraya girme.</small></main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
'use strict';
const el=id=>document.getElementById(id);
const WORKER='https://shorts-studio-free.ahmed-saleh2005.workers.dev';
const setStatus=message=>{el('status').textContent=message;el('audioStatus').textContent=message};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let busy=false,cache=null,requestVersion=0;
function displayVideo(url){const video=el('renderedVideo');video.src=url;video.hidden=false;el('canvas').hidden=true;video.load()}
function invalidate(){requestVersion++;if(cache){URL.revokeObjectURL(cache.url);cache=null}el('renderedVideo').pause();el('renderedVideo').removeAttribute('src');el('renderedVideo').load();el('renderedVideo').hidden=true;el('audioDownload').hidden=true;el('canvas').hidden=true}
async function request(path,key,options={}){const response=await fetch(WORKER+path,{...options,headers:{'x-app-key':key,...(options.headers||{})}});if(!response.ok){let reason='HTTP '+response.status;try{const body=await response.json();reason=body.error||body.message||reason}catch{}throw Error(reason)}return response}
async function generate(download=false){
 if(busy)return;
 const script=el('story').value.trim(),key=el('appkey').value.trim(),lang=el('language').value.startsWith('de')?'de':'en',signature=JSON.stringify([script,lang]),version=requestVersion;
 if(!script){setStatus('Önce metin yaz.');return}
 if(cache?.signature===signature){displayVideo(cache.url);if(download){el('audioDownload').click();setStatus('MP4 hazır. İndirme başlamazsa İndirme bağlantısı düğmesine dokun.')}else{el('renderedVideo').play().catch(()=>{});setStatus('Video hazır. ▶ ile oynatabilirsin.')}return}
 if(!key){setStatus('Cloudflare APP_KEY girmen gerekiyor.');el('appkey').focus();return}
 if(!window.JSZip){setStatus('ZIP kütüphanesi yüklenemedi. Sayfayı yeniden aç.');return}
 busy=true;el('toggle').disabled=true;el('audioSave').disabled=true;el('toggle').textContent='⏳ Hazırlanıyor...';
 try{
  setStatus('⏳ Video oluşturma isteği gönderiliyor...');
  const response=await request('/render',key,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({script,language:lang})});
  const job=await response.json();if(!job.job_id)throw Error('GitHub iş kimliği alınamadı');
  let runId=null;
  for(let attempt=0;attempt<100;attempt++){
   await wait(6000);
   if(version!==requestVersion)throw Error('Metin veya dil değişti. Yeni video için Başlat düğmesine bas.');
   const res=await request('/status?job_id='+encodeURIComponent(job.job_id),key),info=await res.json();
   setStatus('⏳ GitHub video hazırlıyor: '+(info.status||'bekleniyor')+' ('+((attempt+1)*6)+' sn)');
   if(info.status==='completed'){if(info.conclusion!=='success')throw Error('GitHub video üretimi başarısız: '+(info.conclusion||'bilinmiyor'));runId=info.run_id;break}
  }
  if(!runId)throw Error('10 dakika içinde tamamlanmadı');
  let archiveResponse=null;
  for(let i=0;i<12;i++){try{archiveResponse=await request('/artifact?run_id='+encodeURIComponent(runId),key);break}catch(e){if(i===11)throw e;await wait(5000)}}
  setStatus('⏳ MP4 indiriliyor...');
  const zip=await JSZip.loadAsync(await archiveResponse.arrayBuffer());
  const entry=Object.values(zip.files).find(f=>!f.dir&&f.name.toLowerCase().endsWith('.mp4'));
  if(!entry)throw Error('GitHub arşivinde MP4 bulunamadı');
  const blob=await entry.async('blob');
  if(version!==requestVersion)throw Error('Metin veya dil değişti. Yeni video için Başlat düğmesine bas.');
  const url=URL.createObjectURL(new Blob([blob],{type:'video/mp4'}));
  if(cache)URL.revokeObjectURL(cache.url);
  cache={signature,url};const link=el('audioDownload');link.href=url;link.download='shorts-studio-sesli.mp4';link.hidden=false;link.removeAttribute('aria-hidden');
  displayVideo(url);
  if(download){link.click();setStatus('✅ MP4 hazır. İndirme başlamazsa aşağıdaki İndirme bağlantısı düğmesine dokun.');}
  else{el('renderedVideo').play().catch(()=>{});setStatus('✅ MP4 hazır. Oynatıcıdaki ▶ düğmesine dokunarak izleyebilirsin.');}
 }catch(e){setStatus('❌ '+(e?.message||String(e)))}
 finally{busy=false;el('toggle').disabled=false;el('audioSave').disabled=false;el('toggle').textContent='▶ Başlat'}
}
el('toggle').addEventListener('click',()=>generate(false));
el('audioSave').addEventListener('click',()=>generate(true));
el('reset').addEventListener('click',()=>{if(cache){displayVideo(cache.url);el('renderedVideo').currentTime=0;setStatus('Video başa alındı.')}else setStatus('Henüz video oluşturulmadı. ▶ Başlat düğmesine bas.')});
el('story').addEventListener('input',()=>{invalidate();setStatus('Metin değişti. Yeni video için ▶ Başlat düğmesine bas.')});
el('language').addEventListener('change',()=>{invalidate();setStatus('Dil değişti. Yeni video için ▶ Başlat düğmesine bas.')});
el('voice').innerHTML='<option>Otomatik seslendirme</option>';
el('canvas').hidden=true;
setStatus('Hazır. ▶ Başlat düğmesine bas.');
</script></body></html>
