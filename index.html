<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shorts Studio Free</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1322;color:white;font:16px system-ui;padding:18px}
main{max-width:560px;margin:auto}
h1{color:#80e8ce;font-size:27px}
textarea{width:100%;height:155px;background:#202b40;color:white;border:1px solid #53617a;border-radius:12px;padding:14px;font:16px system-ui}
button{background:#7de8cc;color:#09231d;border:0;border-radius:10px;padding:13px;font-weight:bold;margin:5px}
button:disabled{opacity:.4}
canvas{display:block;width:min(100%,320px);aspect-ratio:9/16;margin:18px auto;background:#25304a;border-radius:12px}
small{color:#b5c1d0}
#status{padding:12px;color:#b7e6db}
</style>
</head>
<body><main>
<h1>🎬 Shorts Studio Free</h1>
<p>Almanca hikâyeni yaz. Her cümle için hareketli sahne oluştur.</p>
<textarea id="story">Ein Mann wacht morgens auf. Er geht ins Badezimmer und putzt seine Zähne. Danach geht er in den Supermarkt. Er nimmt einen Apfel und bezahlt an der Kasse.</textarea>
<p>
<button id="create">▶ Oluştur</button>
<button id="voice">🔊 Seslendir</button>
<button id="save">🎥 Video kaydet</button>
</p>
<div id="status">Hazır</div>
<canvas id="canvas" width="540" height="960"></canvas>
<small>Ücretsiz prototip. Görseller basit çizimlerden oluşur. Seslendirme cihazın Almanca seslerine bağlıdır. Video kaydı tarayıcı desteğine bağlıdır ve ses içermeyebilir.</small>
</main>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const story=document.getElementById('story');
const status=document.getElementById('status');
let scenes=[],start=0,playing=false,recording=false;
const W=540,H=960;
function parse(){
 scenes=(story.value.match(/[^.!?]+[.!?]?/g)||[]).map(s=>s.trim()).filter(Boolean);
 return scenes;
}
function classify(s){
 s=s.toLowerCase();
 if(/supermarkt|laden|geschäft|kasse|apfel|einkauf/.test(s))return 'market';
 if(/bad|zahn|zähne|dusche/.test(s))return 'bath';
 if(/bett|schlaf|wach|morgen/.test(s))return 'bed';
 if(/küche|kaffee|essen|trink/.test(s))return 'kitchen';
 if(/schule|lehrer|unterricht/.test(s))return 'school';
 if(/krankenhaus|arzt|patient/.test(s))return 'hospital';
 if(/mond|weltall|planet|erde|weltraum/.test(s))return 'space';
 return 'street';
}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function line(x,y,xx,yy,color,width=10){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke();
}
function sceneDraw(s,t){
 const kind=classify(s);
 const colors={market:'#c2e0d0',bath:'#b9e3ed',bed:'#c7c0df',kitchen:'#ead6b7',school:'#d9d2b8',hospital:'#c6e3e7',space:'#131b3b',street:'#b8d4ec'};
 rect(0,0,W,H,colors[kind]);
 if(kind==='space'){
 for(let i=0;i<35;i++)circle((i*137)%540,(i*211)%650,2,'white');
 circle(430,145,74,'#c9d0e2');
 }else{
 rect(0,690,540,270,'#8197a0');
 rect(0,680,540,14,'#e9eeee');
 }
 if(kind==='market'){
 for(let i=0;i<3;i++){
 rect(i*180+12,220,155,430,'#58796d');
 for(let j=0;j<4;j++){
 rect(i*180+22,250+j*90,135,24,'#dca46b');
 for(let k=0;k<3;k++)circle(i*180+42+k*40,240+j*90,13,'#d95c4d');
 }
 }
 }
 if(kind==='bath'){
 rect(300,180,185,290,'#effaff');
 rect(325,210,135,225,'#a6c7d2');
 rect(25,610,225,85,'#f8ffff');
 rect(80,570,100,45,'#f8ffff');
 }
 if(kind==='bed'){
 rect(30,580,460,125,'#5e7199');
 rect(50,540,130,60,'#f5f5ee');
 rect(180,560,285,75,'#e5a9a0');
 }
 if(kind==='kitchen'){
 rect(15,255,200,310,'#b18a69');
 rect(300,570,220,120,'#fff2dd');
 circle(385,555,32,'#eee');
 }
 if(kind==='school'){
 rect(35,180,470,250,'#426d57');
 rect(45,190,450,230,'#325b49');
 rect(40,615,460,75,'#ae825c');
 }
 if(kind==='hospital'){
 rect(25,230,490,390,'#e8f4f7');
 rect(250,255,35,155,'#d45b60');
 rect(195,310,145,35,'#d45b60');
 }
 if(kind==='street'){
 rect(25,280,165,400,'#a3a9bb');
 rect(355,190,160,490,'#d6b99f');
 for(let i=0;i<3;i++){
 rect(65,330+i*95,65,55,'#e6f0ff');
 rect(390,265+i*100,75,60,'#e6f0ff');
 }
 }
 const moving=Math.sin(t*3);
 const px=250+Math.sin(t*.9)*55;
 const py=450+Math.abs(moving)*7;
 circle(px,py,46,kind==='space'?'#f5f5f5':'#e9b18e');
 rect(px-40,py+48,80,155,kind==='space'?'#f1f1f1':'#3379a3');
 line(px-30,py+205,px-35+moving*22,py+345,'#26374a',23);
 line(px+30,py+205,px+35-moving*22,py+345,'#26374a',23);
 line(px-40,py+70,px-75-moving*13,py+175,'#26374a',18);
 line(px+40,py+70,px+75+moving*13,py+175,'#26374a',18);
 if(/apfel/.test(s.toLowerCase()))circle(px+75,py+170,23,'#e84743');
 if(/zahn|zähne/.test(s.toLowerCase()))line(px+30,py+18,px+68,py+15,'#f4f4f4',9);
 if(/kaffee/.test(s.toLowerCase()))rect(px+60,py+145,55,50,'#fff4e8');
 rect(0,807,540,153,'#101827');
 ctx.fillStyle='white';
 ctx.textAlign='center';
 ctx.font='bold 27px system-ui';
 const words=s.split(' '),rows=[];let row='';
 for(const word of words){
 if((row+' '+word).length>29){if(row)rows.push(row);row=word;}
 else row+=(row?' ':'')+word;
 }
 if(row)rows.push(row);
 rows.slice(0,4).forEach((r,i)=>ctx.fillText(r,270,848+i*32,505));
}
function frame(now){
 if(!playing)return;
 const elapsed=(now-start)/1000;
 const index=Math.floor(elapsed/4);
 if(index>=scenes.length){
 playing=false;
 status.textContent='Önizleme tamamlandı';
 return;
 }
 sceneDraw(scenes[index],elapsed);
 requestAnimationFrame(frame);
}
function play(){
 if(!parse().length){status.textContent='Önce metin yaz';return;}
 playing=true;start=performance.now();
 status.textContent=scenes.length+' sahne oluşturuluyor';
 requestAnimationFrame(frame);
}
document.getElementById('create').onclick=play;
document.getElementById('voice').onclick=()=>{
 if(!('speechSynthesis' in window)){
 status.textContent='Seslendirme desteklenmiyor';return;
 }
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(story.value);
 u.lang='de-DE';u.rate=.95;
 speechSynthesis.speak(u);
 status.textContent='Almanca seslendirme başlatıldı';
};
document.getElementById('save').onclick=()=>{
 if(!canvas.captureStream||!window.MediaRecorder){
 status.textContent='Bu tarayıcıda video kaydı desteklenmiyor';
 return;
 }
 if(recording)return;
 parse();if(!scenes.length)return;
 try{
 const stream=canvas.captureStream(30);
 const types=['video/mp4','video/webm;codecs=vp8','video/webm'];
 const mime=types.find(v=>MediaRecorder.isTypeSupported(v));
 if(!mime){status.textContent='Uygun video formatı bulunamadı';return;}
 const chunks=[];
 const recorder=new MediaRecorder(stream,{mimeType:mime});
 recording=true;
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onerror=()=>{recording=false;status.textContent='Kayıt hatası'};
 recorder.onstop=()=>{
 recording=false;stream.getTracks().forEach(t=>t.stop());
 const blob=new Blob(chunks,{type:mime});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download='shorts-studio.'+(mime.includes('mp4')?'mp4':'webm');
 a.click();status.textContent='Kayıt hazır';
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 };
 recorder.start();play();
 status.textContent='Video kaydediliyor';
 setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},scenes.length*4000+300);
 }catch(e){recording=false;status.textContent='Kayıt başlatılamadı: '+e.message;}
};
parse();sceneDraw(scenes[0]||'',0);
</script>
</body></html>
