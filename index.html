<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts Studio Free 6.1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1324;color:#f0f6ff;font:16px system-ui}main{max-width:650px;margin:auto;padding:18px}h1{font-size:25px;color:#9de7d2}textarea{width:100%;height:155px;background:#1e2a42;color:white;border:1px solid #667b96;border-radius:14px;padding:14px;font:16px system-ui}button,select{border:0;border-radius:12px;padding:13px;font:600 15px system-ui}button{background:#9de7d2;color:#06271e}button:disabled{opacity:.5}select{background:#283750;color:white;width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.field{display:grid;gap:5px;flex:1;min-width:145px}.field label{font-size:13px;color:#bed1e7}canvas{display:block;width:min(100%,350px);aspect-ratio:9/16;margin:15px auto;background:#14233a;border-radius:14px}#status{min-height:44px;color:#9de7d2}a{color:#9de7d2;display:inline-block;padding:12px}small{color:#b7c6dc;line-height:1.5;display:block}</style></head>
<body><main><h1>🎬 Shorts Studio Free 6.1</h1><p>Metnini yaz, ses seç, oynat veya video oluştur.</p>
<textarea id="story">Ein Mann wacht morgens auf. Er geht ins Badezimmer und putzt seine Zähne. Danach geht er in den Supermarkt. Er nimmt einen Apfel und bezahlt an der Kasse.</textarea>
<div class="row"><div class="field"><label for="language">Ses dili</label><select id="language"><option value="de-DE">🇩🇪 Almanca</option><option value="en-US">🇬🇧 İngilizce</option></select></div><div class="field"><label for="voice">Cihazdaki ses</label><select id="voice"><option value="">Sesler yükleniyor...</option></select></div></div>
<div class="row"><button id="toggle">▶ Başlat</button><button id="reset">↺ Baştan</button><button id="save">📥 Sessiz video kaydet</button></div>
<div id="status" role="status">Hazır.</div><a id="download" hidden>Videoyu indir</a><canvas id="canvas" width="540" height="960"></canvas>
<small>Önizleme cihaz sesini kullanır. İndirilen kayıt şu an SESSİZDİR. Sesli MP4 üzerinde çalışılıyor. Mikrofon izni istenmez.</small></main>
<script>
'use strict';
const $=id=>document.getElementById(id),c=$('canvas'),x=c.getContext('2d'),W=540,H=960;
let scenes=[],index=0,state='idle',utter=null,voices=[],generation=0,raf=0,sceneElapsed=0,frameStart=0,recording=false,recorder=null,stream=null,parts=[],downloadUrl='',recordTimer=0;
const status=s=>$('status').textContent=s;
const split=t=>(t.match(/[^.!?\n]+[.!?]?/gu)||[]).map(s=>s.trim()).filter(Boolean).slice(0,80);
function classify(s,prev){let q=s.toLowerCase(),p='city';if(/supermarkt|market|shop|laden|geschäft|einkauf|grocer|store/.test(q))p='market';else if(/badezimmer|zahn|dusche|bathroom|brush|shower/.test(q))p='bath';else if(/schlaf|bett|aufwach|wacht .*auf|wake|woke|bedroom|sleep/.test(q))p='bed';else if(/küche|kochen|essen|kitchen|cook/.test(q))p='kitchen';else if(/schule|unterricht|school|classroom/.test(q))p='school';else if(/krankenhaus|arzt|hospital|doctor/.test(q))p='hospital';else if(/wald|baum|forest|tree/.test(q))p='forest';else if(/büro|arbeit|office|work/.test(q))p='office';else if(/bus|zug|bahn|train|station/.test(q))p='station';else if(/weltall|planet|space|moon|mond/.test(q))p='space';else if(prev&&/^(er|sie|es|dann|danach|he|she|then|und)\b/.test(q)&&p==='city')p=prev.place;let a=/zahn|putz|brush/.test(q)?'brush':/aufwach|wacht .*auf|wake|woke|get(s)? up/.test(q)?'wake':/einsteig|steigt .*ein|board(s|ing)?|get(s)? on/.test(q)?'board':/apfel|apple|nimmt|take/.test(q)?'take':/bezahl|kasse|pay/.test(q)?'pay':/schlaf|bett|sleep/.test(q)?'sleep':/geh|lauf|walk|go|fahr|drive|bus|zug|train/.test(q)?'walk':'talk';return {text:s,place:p,action:a}}
function prepare(){const a=split($('story').value);if(!a.length){status('Önce metin yaz.');return false}scenes=[];for(const sentence of a)scenes.push(classify(sentence,scenes.at(-1)));index=0;sceneElapsed=0;draw(scenes[0],0,0);return true}
function R(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function C(a,b,r,col){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fillStyle=col;x.fill()}function L(a,b,d,e,col,w=9){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}function T(s,a,b,size=28,col='white'){x.fillStyle=col;x.font=`bold ${size}px system-ui`;x.textAlign='center';x.fillText(s,a,b)}
function background(s,t){let p=s.place;R(0,0,W,H,p==='space'?'#09132c':p==='forest'?'#b3e4da':'#b5d9ee');C(430,135,52,'#ffdb80');R(0,600,540,220,p==='forest'?'#6caa71':'#d2c6b5');if(p==='market'){R(28,180,484,390,'#f4f3e7');for(let i=0;i<3;i++){R(65,250+i*98,410,18,'#916b4e');for(let j=0;j<7;j++)C(92+j*58,226+i*98,19,['#e95b55','#f6c75a','#6db77b'][j%3])}T('SUPERMARKT',270,130,39,'#253f6a')}else if(p==='bath'){R(50,165,440,420,'#e9f4f7');R(80,420,380,40,'#92c9d8');R(180,320,180,90,'#fff');C(270,360,26,'#a7d5e0')}else if(p==='bed'){R(40,200,460,380,'#d4d7f3');R(70,485,400,110,'#6c83bd');R(90,440,150,70,'#fff1d2')}else if(p==='school'){R(55,150,430,390,'#f1f3e5');R(90,190,360,230,'#31745e');T('A B C',270,330,66)}else if(p==='hospital'){R(60,140,420,440,'#f6f7f8');R(255,185,30,90,'#e45e66');R(225,215,90,30,'#e45e66')}else if(p==='space'){for(let i=0;i<65;i++)C((i*137)%540,(i*233)%710,2,'#fff');C(400,275,120,'#5d85ce')}else if(p==='forest'){for(let i=0;i<6;i++){let a=40+i*95;R(a,320,23,310,'#785c45');C(a+10,300,76,'#4d9863')}}else if(p==='station'){R(30,300,480,240,'#e9eff3');R(70,370,400,150,'#4b82a9');T('STATION',270,220,44,'#203a62')}else if(p==='office'){R(45,160,450,400,'#e8ecf4');R(90,400,360,25,'#796b61');R(170,310,200,90,'#293e64')}else if(p==='kitchen'){R(45,180,450,360,'#fff2dc');R(55,440,430,120,'#b48d75');R(200,350,140,85,'#586b83')}else{for(let i=0;i<6;i++){let a=i*105;R(a,230+i%2*60,90,390,'#799bb5')}}}
function character(s,t){
  const walk=s.action==='walk'||s.action==='board', stride=walk?Math.sin(t*7)*32:Math.sin(t*2)*3;
  const px=270+(walk?Math.sin(t*.65)*18:0),py=515+Math.sin(t*3)*(walk?5:2);
  const skin='#e9ae89',hair='#25324b',shirt='#4b78c7',pants='#273956';
  x.save();x.translate(px,py);
  // Ground shadow and shoes
  x.fillStyle='rgba(19,38,59,.18)';x.beginPath();x.ellipse(0,223,93,16,0,0,Math.PI*2);x.fill();
  L(-23,86,-24+stride,200,pants,23);L(23,86,24-stride,200,pants,23);
  L(-24+stride,200,-44+stride,207,'#18253a',17);L(24-stride,200,46-stride,207,'#18253a',17);
  // Torso with rounded silhouette and neckline
  x.fillStyle=shirt;x.beginPath();x.roundRect(-54,-52,108,148,24);x.fill();
  x.fillStyle='#3c65ac';x.beginPath();x.roundRect(-10,-35,20,124,9);x.fill();
  x.fillStyle='#f3f7fa';x.beginPath();x.moveTo(-17,-52);x.lineTo(0,-24);x.lineTo(17,-52);x.fill();
  const brush=s.action==='brush',wake=s.action==='wake',take=s.action==='take',pay=s.action==='pay';
  const handY=brush?-87+Math.sin(t*12)*7:wake?-100:take?20:pay?12:45;
  L(-46,-25,-85,handY,skin,19);L(46,-25,85,handY,skin,19);
  C(-85,handY,11,skin);C(85,handY,11,skin);
  // Neck, ears and face
  R(-16,-70,32,25,skin);C(-48,-107,10,skin);C(48,-107,10,skin);
  x.fillStyle=skin;x.beginPath();x.ellipse(0,-111,48,58,0,0,Math.PI*2);x.fill();
  x.fillStyle=hair;x.beginPath();x.ellipse(0,-154,47,24,-.1,Math.PI,Math.PI*2);x.fill();
  x.beginPath();x.ellipse(-32,-145,18,23,-.4,0,Math.PI*2);x.fill();
  C(-17,-116,4,'#25324b');C(17,-116,4,'#25324b');
  L(-27,-130,-8,-132,'#574335',3);L(8,-132,27,-130,'#574335',3);
  x.strokeStyle='#9d625b';x.lineWidth=3;x.beginPath();x.arc(0,-94,11,.15,Math.PI-.15);x.stroke();
  if(brush){L(85,handY,15,-93,'#f3f8ff',8);R(8,-101,18,7,'#50c8c5');}
  if(take){C(95,handY-9,21,'#e75d58');L(95,handY-31,100,handY-40,'#5c8756',4);}
  if(pay){x.save();x.translate(88,handY);x.rotate(-.15);R(-19,-12,39,26,'#f5d27a');R(-12,-5,25,4,'#b59654');x.restore();}
  if(wake){T('☀',120,-235,42,'#e8ac41');}
  if(s.action==='sleep')T('Z z z',115,-195,37,'#596b9b');
  if(s.action==='board'){R(-225,-55,125,140,'#3b83ae');R(-205,-39,80,53,'#bde7ef');R(-120,28,10,70,'#e7f3f9');}
  x.restore();
}
function caption(text){
  const words=text.trim().split(/\s+/).filter(Boolean), maxWidth=466;
  let fontSize=29,lines=[];
  for(;fontSize>=20;fontSize-=2){
    x.font='bold '+fontSize+'px system-ui';lines=[];let line='';
    for(const word of words){
      const trial=line?line+' '+word:word;
      if(x.measureText(trial).width>maxWidth&&line){lines.push(line);line=word;}else line=trial;
    }
    if(line)lines.push(line);
    if(lines.length<=4&&lines.every(line=>x.measureText(line).width<=maxWidth))break;
  }
  return {lines,fontSize};
}
function draw(s,t,progress){if(!s)return;x.clearRect(0,0,W,H);x.save();x.translate(270,480);let z=1+.012*Math.sin(t);x.scale(z,z);x.translate(-270,-480);background(s,t);character(s,t);x.restore();R(0,804,540,156,'#0d1527');const cap=caption(s.text);cap.lines.forEach((line,i)=>T(line,270,840+i*(cap.fontSize+4),cap.fontSize));R(0,950,540*Math.max(0,Math.min(1,progress)),10,'#9de7d2')}
function loadVoices(){if(!('speechSynthesis'in window))return;const previous=$('voice').value;voices=speechSynthesis.getVoices();const lang=$('language').value.split('-')[0],options=voices.map((v,i)=>({v,i})).filter(o=>o.v.lang.toLowerCase().startsWith(lang));$('voice').replaceChildren();if(!options.length){const e=document.createElement('option');e.value='';e.textContent=voices.length?'Bu dilde ses yok':'Sesler yükleniyor...';$('voice').append(e);return}for(const o of options){const e=document.createElement('option');e.value=String(o.i);e.textContent=o.v.name+' ('+o.v.lang+')';$('voice').append(e)}$('voice').value=options.some(o=>String(o.i)===previous)?previous:String(options[0].i)}
function cancelSpeech(){generation++;utter=null;if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(e){}}
function stopAnimation(){cancelAnimationFrame(raf);raf=0}
function controls(){$('toggle').textContent=state==='playing'?'⏸ Durdur':state==='paused'?'▶ Devam et':'▶ Başlat';$('toggle').disabled=recording;$('reset').disabled=recording;$('save').disabled=recording;$('story').disabled=recording}
function resetPlayback(){cancelSpeech();stopAnimation();state='idle';index=0;sceneElapsed=0;controls()}
function animate(){stopAnimation();frameStart=performance.now();const tick=now=>{if(state!=='playing')return;const elapsed=sceneElapsed+(now-frameStart)/1000;draw(scenes[index],elapsed,Math.min(1,elapsed/5));raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function finish(){resetPlayback();if(scenes.length)draw(scenes[scenes.length-1],5,1);status('Oynatma tamamlandı. Yeniden başlatabilirsin.')}
function speak(){if(state!=='playing')return;if(index>=scenes.length){finish();return}const id=++generation;const u=new SpeechSynthesisUtterance(scenes[index].text);utter=u;u.lang=$('language').value;u.rate=1;const value=$('voice').value;if(value!==''&&voices[Number(value)])u.voice=voices[Number(value)];u.onstart=()=>{if(id!==generation||state!=='playing')return;sceneElapsed=0;animate();status('Okunuyor: '+(index+1)+'/'+scenes.length)};u.onend=()=>{if(id!==generation||state!=='playing')return;stopAnimation();index++;sceneElapsed=0;if(index>=scenes.length)finish();else{draw(scenes[index],0,0);speak()}};u.onerror=e=>{if(id!==generation)return;if(e.error==='interrupted'||e.error==='canceled')return;resetPlayback();status('Seslendirme hatası: '+e.error+'. Baştan deneyin.')};try{speechSynthesis.speak(u)}catch(e){resetPlayback();status('Ses başlatılamadı: '+e.message)}}
$('toggle').onclick=()=>{if(recording)return;if(state==='playing'){sceneElapsed+=(performance.now()-frameStart)/1000;state='paused';stopAnimation();try{speechSynthesis.pause()}catch(e){}controls();status('Duraklatıldı. Devam et düğmesine bas.');return}if(state==='paused'){state='playing';try{speechSynthesis.resume()}catch(e){resetPlayback();status('Ses devam ettirilemedi: '+e.message);return}animate();controls();status('Devam ediyor.');return}if(!('speechSynthesis'in window)){status('Tarayıcı seslendirmeyi desteklemiyor.');return}resetPlayback();if(!prepare())return;state='playing';controls();speak()};
$('reset').onclick=()=>{if(recording)return;resetPlayback();prepare();status('Başa alındı.')};
$('story').addEventListener('input',()=>{if(recording)return;resetPlayback();if(downloadUrl){URL.revokeObjectURL(downloadUrl);downloadUrl='';} $('download').hidden=true;status('Metin değişti. Başlat düğmesine bas.')});
$('language').onchange=()=>{resetPlayback();$('download').hidden=true;loadVoices();status('Dil değişti. Cihazdaki sesi seç.')};
$('voice').onchange=()=>{resetPlayback();$('download').hidden=true;status('Ses seçildi. Başlat düğmesine bas.')};
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,400);setTimeout(loadVoices,1500)}else $('voice').innerHTML='<option>Seslendirme desteklenmiyor</option>';
function mime(){if(!window.MediaRecorder)return'';return ['video/mp4;codecs="avc1.42E01E"','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||''}
$('save').onclick=()=>{if(recording)return;resetPlayback();if(!prepare())return;if(!c.captureStream||!window.MediaRecorder){status('Bu tarayıcı video kaydını desteklemiyor.');return}const m=mime();if(!m){status('Desteklenen video biçimi bulunamadı.');return}try{stream=c.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:m,videoBitsPerSecond:3000000});parts=[];recording=true;controls();$('download').hidden=true;recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recorder.onerror=()=>{parts=[];status('Kayıt sırasında hata oluştu. Dosya sunulmayacak.')};recorder.onstop=()=>{recording=false;clearTimeout(recordTimer);stopAnimation();stream?.getTracks().forEach(t=>t.stop());controls();if(!parts.length){status('Video oluşturulamadı.');return}if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(new Blob(parts,{type:m}));const actual=parts[0]?.type||m;const ext=actual.includes('mp4')?'mp4':actual.includes('webm')?'webm':'';if(!ext){status('Kayıt biçimi doğrulanamadı; dosya sunulmadı.');return}const a=$('download');a.href=downloadUrl;a.download='shorts-studio.'+ext;a.textContent='📥 '+ext.toUpperCase()+' videoyu indir';a.hidden=false;status('Yalnızca SESSİZ video hazır. Sesli MP4 henüz desteklenmiyor.')};recorder.start(250);const start=performance.now(),per=5000,total=scenes.length*per;const tick=now=>{if(!recording||recorder.state==='inactive')return;const elapsed=Math.min(total,now-start),i=Math.min(scenes.length-1,Math.floor(elapsed/per));draw(scenes[i],elapsed/1000,(elapsed%per)/per);if(elapsed<total)raf=requestAnimationFrame(tick);else if(recorder.state!=='inactive')recorder.stop()};raf=requestAnimationFrame(tick);recordTimer=setTimeout(()=>{if(recorder&&recorder.state!=='inactive')recorder.stop()},total+2500);status('Sessiz video hazırlanıyor...')}catch(e){recording=false;clearTimeout(recordTimer);stopAnimation();stream?.getTracks().forEach(t=>t.stop());controls();status('Kayıt hatası: '+e.message)}};
prepare();controls();
</script></body></html>
