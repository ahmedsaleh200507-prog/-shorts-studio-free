name: Blender cinematic 2D pilot
on:
  push:
    branches: [main]
    paths:
      - 'blender/**'
      - '.github/workflows/blender-pilot.yml'
  workflow_dispatch:
    inputs:
      script:
        description: 'German or English script for scene planning (pilot supports city, phone, map only)'
        required: false
        type: string
        default: 'Die Stadt ist dunkel. Das Handy zeigt eine Warnung. Die Karte zeigt den Weg.'
permissions:
  contents: read
jobs:
  blender-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender ffmpeg libegl1 libgl1 libopengl0 libglx-mesa0 libgl1-mesa-dri libgbm1 libxrender1 libxi6 libxkbcommon0 xvfb mesa-utils
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so.1
          ldconfig -p | grep 'libEGL.so.1'
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Test and inspect script-to-scene planner
        env:
          SCRIPT: ${{ inputs.script || 'Die Stadt ist dunkel. Das Handy zeigt eine Warnung. Die Karte zeigt den Weg.' }}
        run: |
          python -m unittest discover -s blender -p 'test_*.py' -v
          mkdir -p output
          printf '%s' "$SCRIPT" | python blender/scene_planner.py > output/scene-plan.json
          cat output/scene-plan.json
          python - <<'PY'
          import json
          plan=json.load(open('output/scene-plan.json',encoding='utf-8'))
          kinds=[scene['visual'] for scene in plan['scenes']]
          assert len(kinds)==3 and sorted(kinds)==['city','map','phone'], 'Pilot currently needs one city, phone and map sentence, in any order.'
          print('Blender render order:',kinds)
          PY
      - name: Render animated 2D frames
        env:
          BLENDER_SCENE_PLAN: output/scene-plan.json
        run: |
          mkdir -p output/blender-frames
          python -m py_compile blender/cinematic_blackout.py
          xvfb-run -a -s '-screen 0 1280x1024x24' blender -b -t 2 --python-exit-code 1 --python blender/cinematic_blackout.py
          test -s output/blender-frames/frame_0001.png
          test -s output/blender-frames/frame_0240.png
          test "$(find output/blender-frames -name 'frame_*.png' | wc -l)" -eq 240
      - name: Encode and verify MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i output/blender-frames/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -crf 23 -movflags +faststart output/blender-pilot.mp4
          test -s output/blender-pilot.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json output/blender-pilot.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/blender-pilot.mp4 | tee output/verification.txt
          grep -q 'codec_name=h264' output/verification.txt
          grep -q 'width=720' output/verification.txt
          grep -q 'height=1280' output/verification.txt
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/blender-pilot.mp4)
          python -c "import sys; d=float(sys.argv[1]); assert 9.9 <= d <= 10.1, f'Unexpected video duration: {d}'" "$duration"
          mkdir -p output/quality
          for t in 1.5 4.5 8.5; do
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i output/blender-pilot.mp4 -frames:v 1 "output/quality/scene-$t.png"
          done
          python - <<'PY'
          import hashlib
          from pathlib import Path
          frames = sorted(Path('output/quality').glob('scene-*.png'))
          assert len(frames) == 3, 'Missing scene preview'
          hashes = [hashlib.sha256(f.read_bytes()).hexdigest() for f in frames]
          assert len(set(hashes)) == 3, 'Different scenes rendered as identical frames'
          assert all(f.stat().st_size > 10000 for f in frames), 'Scene frame too small or blank'
          print('Scene variation verified:', [f.name for f in frames])
          PY
      - name: Upload scene plan
        uses: actions/upload-artifact@v4
        with:
          name: blender-scene-plan
          path: output/scene-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload scene quality previews
        uses: actions/upload-artifact@v4
        with:
          name: blender-scene-previews
          path: output/quality/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: blender-2d-engine-pilot
          path: output/blender-pilot.mp4
          if-no-files-found: error
          retention-days: 7
