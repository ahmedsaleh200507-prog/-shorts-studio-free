name: Render narrated 2D MP4
run-name: Shorts ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'German or English text (up to 3000 characters)'
        required: true
        type: string
      job_id:
        description: 'Unique render request identifier'
        required: false
        default: manual
        type: string
      language:
        description: 'Narration language'
        required: true
        default: de
        type: choice
        options:
          - de
          - en
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion and narration dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 5 edge-tts mutagen
          cd animation
          npm ci --no-audit --no-fund
          npm test
          npx remotion browser ensure
      - name: Prepare real user script and synchronized narration
        env:
          SCRIPT: ${{ inputs.script }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          python animation/prepare-job.py
          test -s animation/job-entry.mjs
          test -s animation/narration-audio.mjs
      - name: Render actual Remotion 2D video
        working-directory: animation
        run: |
          mkdir -p ../output
          npx remotion render job-entry.mjs ShortsJob ../output/final.mp4 --codec h264 --crf 26 --concurrency 1 --scale 0.5
      - name: Validate real MP4 file
        run: |
          test -s output/final.mp4
          node --input-type=module -e "
            import {readFileSync,statSync} from 'node:fs';
            const f='output/final.mp4', b=readFileSync(f);
            if(statSync(f).size<10000) throw Error('MP4 too small');
            if(b.toString('ascii',4,8)!=='ftyp') throw Error('Missing MP4 header');
            if(!b.includes(Buffer.from('moov')) || !b.includes(Buffer.from('mdat'))) throw Error('Invalid MP4 structure');
            console.log('Production Remotion MP4:',b.length,'bytes');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-sesli-mp4
          path: output/final.mp4
          if-no-files-found: error
          retention-days: 3
