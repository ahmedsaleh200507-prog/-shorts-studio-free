name: Render narrated 2D MP4
run-name: Shorts ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'German or English text (up to 3000 characters)'
        required: true
        type: string
      job_id:
        description: 'Unique render request identifier'
        required: false
        default: manual
        type: string
      language:
        description: 'Narration language'
        required: true
        default: de
        type: choice
        options:
          - de
          - en
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render/requirements.txt
      - name: Install static FFmpeg and FFprobe (no apt)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shorts-ffmpeg"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o "$RUNNER_TEMP/ffmpeg-static.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-static.tar.xz" \
            --wildcards --no-anchored 'ffmpeg' 'ffprobe' \
            --strip-components=1 -C "$RUNNER_TEMP/shorts-ffmpeg"
          chmod +x "$RUNNER_TEMP/shorts-ffmpeg/ffmpeg" "$RUNNER_TEMP/shorts-ffmpeg/ffprobe"
          echo "$RUNNER_TEMP/shorts-ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shorts-ffmpeg/ffmpeg" -version | head -n 1
          "$RUNNER_TEMP/shorts-ffmpeg/ffprobe" -version | head -n 1
      - name: Verify FFmpeg and install renderer
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -r render/requirements.txt
      - name: Check renderer syntax and FFmpeg codecs
        run: |
          python -m py_compile render/render.py render/comfyui_client.py render/motion2d.py render/test_motion2d.py
          python render/test_motion2d.py
          ffmpeg -hide_banner -encoders > /tmp/shorts-encoders.txt
          grep -E '^[[:space:]]*V.*libx264([[:space:]]|$)' /tmp/shorts-encoders.txt || { echo '::error::H.264 encoder unavailable'; exit 1; }
          grep -E '^[[:space:]]*A.*aac([[:space:]]|$)' /tmp/shorts-encoders.txt || { echo '::error::AAC encoder unavailable'; exit 1; }
      - name: Render and verify audio/video
        env:
          SCRIPT: ${{ inputs.script }}
          LANGUAGE: ${{ inputs.language }}
          COMFYUI_URL: ${{ secrets.COMFYUI_URL }}
          COMFYUI_API_TOKEN: ${{ secrets.COMFYUI_API_TOKEN }}
          COMFYUI_CHECKPOINT: ${{ secrets.COMFYUI_CHECKPOINT }}
          COMFYUI_WORKFLOW: render/comfyui_workflow.json
        run: |
          python render/render.py --text "$SCRIPT" --lang "$LANGUAGE" --out output/final.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type -of json output/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-sesli-mp4
          path: output/final.mp4
          if-no-files-found: error
          retention-days: 3
