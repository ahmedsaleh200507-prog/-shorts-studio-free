name: Render narrated 2D MP4
run-name: Shorts ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'German or English text (up to 3000 characters)'
        required: true
        type: string
      job_id:
        description: 'Unique render request identifier'
        required: false
        default: manual
        type: string
      language:
        description: 'Narration language'
        required: true
        default: de
        type: choice
        options:
          - de
          - en
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render/requirements.txt
      - name: Install FFmpeg and renderer
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Using preinstalled FFmpeg and FFprobe"
          else
            echo "FFmpeg/FFprobe missing; installing with network retries"
            sudo apt-get -o Acquire::Retries=5 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -r render/requirements.txt
      - name: Render and verify audio/video
        env:
          SCRIPT: ${{ inputs.script }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          python render/render.py --text "$SCRIPT" --lang "$LANGUAGE" --out output/final.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type -of json output/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-sesli-mp4
          path: output/final.mp4
          if-no-files-found: error
          retention-days: 3
