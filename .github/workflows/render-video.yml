name: Render narrated 2D MP4
run-name: Shorts ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'German or English text (up to 12000 characters)'
        required: true
        type: string
      aspect_ratio:
        description: 'Video orientation'
        required: false
        default: '9:16'
        type: choice
        options:
          - '9:16'
          - '16:9'
      job_id:
        description: 'Unique render request identifier'
        required: false
        default: manual
        type: string
      language:
        description: 'Narration language'
        required: true
        default: de
        type: choice
        options:
          - de
          - en
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion and narration dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 5 edge-tts mutagen
          cd animation
          npm install --no-audit --no-fund
          npm test
          python -m unittest discover -s . -p 'test_long_video.py' -v
          python -m unittest discover -s . -p 'test_render_production.py' -v
          npx remotion browser ensure
      - name: Ensure FFmpeg and ffprobe for every production mode
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Prepare real user script and synchronized narration
        env:
          SCRIPT: ${{ inputs.script }}
          LANGUAGE: ${{ inputs.language }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
        run: |
          python animation/prepare-job.py
          test -s animation/job-entry.mjs
          test -s animation/narration-audio.mjs
      - name: Generate real AI scene images
        env:
          SCRIPT: ${{ inputs.script }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          AI_IMAGE_MODELS: black-forest-labs/flux.1-schnell,tongyi-mai/z-image-turbo
          AI_MAX_IMAGES: '18'
        run: |
          python animation/generate-ai-scenes.py
          test -s animation/ai-scene-images.mjs
      - name: Install native Godot renderer for vector 2D mode
        if: contains(inputs.script, '[[VECTOR_2D]]')
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb unzip
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Render selected 2D engine with narration
        env:
          SCRIPT: ${{ inputs.script }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
        run: |
          mkdir -p output
          if [[ "$SCRIPT" == *'[[VECTOR_2D]]'* ]]; then
            xvfb-run -a python animation/render-production.py
          else
            python animation/render-production.py
          fi
      - name: Validate real MP4 file
        run: |
          test -s output/final.mp4
          node --input-type=module -e "
            import {readFileSync,statSync} from 'node:fs';
            const f='output/final.mp4', b=readFileSync(f);
            if(statSync(f).size<10000) throw Error('MP4 too small');
            if(b.toString('ascii',4,8)!=='ftyp') throw Error('Missing MP4 header');
            if(!b.includes(Buffer.from('moov')) || !b.includes(Buffer.from('mdat'))) throw Error('Invalid MP4 structure');
            console.log('Production Remotion MP4:',b.length,'bytes');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-sesli-mp4
          path: output/final.mp4
          if-no-files-found: error
          retention-days: 3
