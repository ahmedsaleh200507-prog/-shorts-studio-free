name: Godot and Blender 2D engine smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - 'blender/**'
      - 'animation/render-godot-video.py'
      - 'animation/test_godot_render.py'
      - 'animation/scene-plan.mjs'
      - 'animation/export-godot-plan.mjs'
      - 'animation/test-godot-plan.mjs'
      - 'animation/render-godot-story.py'
      - 'animation/test_godot_story.py'
      - '.github/workflows/test-godot-blender.yml'
permissions:
  contents: read
jobs:
  native-2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test German and English scene-plan bridge
        run: node --test animation/test-godot-plan.mjs
      - name: Run fast renderer unit tests
        run: python -m unittest discover -s animation -p 'test_godot_render.py' -v
      - name: Run offline story subtitle and audio validation tests
        run: python -m unittest discover -s animation -p 'test_godot_story.py' -v
      - name: Install FFmpeg and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb unzip
      - name: Install Godot 4 headless
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Test articulated two-bone IK skeleton
        run: godot --headless --path godot --script res://test_ik.gd
      - name: Test stance foot lock and swing lift
        run: godot --headless --path godot --script res://test_foot_plant.gd
      - name: Install Blender 4.3 for Grease Pencil v3
        run: |
          curl -fL --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          sudo ln -s /tmp/blender-4.3.2-linux-x64/blender /usr/local/bin/blender
          blender --version | head -n 1
      - name: Create actual editable Grease Pencil asset
        run: |
          blender --background --factory-startup --python blender/export_2d_assets.py -- --out blender/export
          test -s blender/export/shorts-2d-assets.blend
      - name: Render Godot 2D animation frames
        run: |
          mkdir -p output/godot-frames
          xvfb-run -a godot --path godot --rendering-driver opengl3 -- --action=brush --place=bathroom --frames=48 --out="$PWD/output/godot-frames"
          test "$(find output/godot-frames -name 'frame_*.png' | wc -l)" -eq 48
          file output/godot-frames/frame_00000.png
      - name: Verify real rendered animation changes between frames
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          frames = sorted(Path("output/godot-frames").glob("frame_*.png"))
          assert len(frames) == 48, f"Expected 48 frames, got {len(frames)}"
          sizes = set()
          digests = set()
          for frame in frames:
              data = frame.read_bytes()
              assert data[:8] == bytes([137,80,78,71,13,10,26,10]), frame
              sizes.add(struct.unpack(">II", data[16:24]))
              digests.add(hashlib.sha256(data).hexdigest())
          assert sizes == {(540, 960)}, sizes
          assert len(digests) >= 12, f"Animation appears frozen: {len(digests)} unique frames"
          print(f"Verified {len(frames)} actual PNG frames, {len(digests)} distinct frames, size 540x960")
          PY
      - name: Generate Godot visual review contact sheet
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i output/godot-frames/frame_%05d.png -vf "select='not(mod(n,8))',scale=270:480,tile=3x2" -frames:v 1 output/godot-contact-sheet.png
          test -s output/godot-contact-sheet.png
      - name: Verify landscape Godot output
        run: |
          mkdir -p output/godot-landscape
          xvfb-run -a godot --path godot --rendering-driver opengl3 -- --action=travel --place=transport --frames=24 --aspect=16:9 --out="$PWD/output/godot-landscape"
          test "$(find output/godot-landscape -name 'frame_*.png' | wc -l)" -eq 24
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path("output/godot-landscape/frame_00000.png")
          data = p.read_bytes()
          assert data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10])
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (960, 540), (width, height)
          print("Landscape PNG verified:", width, height)
          PY
      - name: Generate landscape visual review frame
        run: |
          ffmpeg -hide_banner -loglevel error -y -i output/godot-landscape/frame_00012.png -frames:v 1 output/godot-landscape-preview.png
          test -s output/godot-landscape-preview.png
      - name: Encode and validate real MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i output/godot-frames/frame_%05d.png -c:v libx264 -pix_fmt yuv420p output/godot-demo.mp4
          test -s output/godot-demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 output/godot-demo.mp4
      - name: Verify Godot plus FFmpeg orchestrator with narration
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:duration=2 -c:a libmp3lame output/test-narration.mp3
          xvfb-run -a python animation/render-godot-video.py --action=brush --place=bathroom --seconds=2 --audio=output/test-narration.mp3 --out=output/godot-narrated.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/godot-narrated.mp4 | grep -q aac
      - name: Render three-scene German story with captions
        run: |
          xvfb-run -a python animation/render-godot-story.py --script "Er wacht auf. Er putzt die Zähne. Er nimmt einen Apfel." --out output/godot-story.mp4
          test -s output/godot-story.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 output/godot-story.mp4 | grep -q h264
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/godot-story.mp4 | grep -q aac
      - name: Simulate iPhone vector-mode request through production router
        env:
          SCRIPT: "[[VECTOR_2D]] Er putzt die Zähne."
          ASPECT_RATIO: "9:16"
        run: |
          mkdir -p animation/public/audio
          cp output/test-narration.mp3 animation/public/audio/job-0.mp3
          xvfb-run -a python animation/render-production.py
          test -s output/final.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 output/final.mp4 | grep -q 'h264,540,960'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/final.mp4 | grep -q aac
      - uses: actions/upload-artifact@v4
        with:
          name: godot-2d-demo-mp4
          path: |
            output/godot-demo.mp4
            output/final.mp4
            output/godot-narrated.mp4
            output/godot-story.mp4
            output/godot-contact-sheet.png
            output/godot-landscape-preview.png
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: blender-2d-source
          path: blender/export/shorts-2d-assets.blend
          if-no-files-found: error
          retention-days: 3
