name: Godot and Blender 2D engine smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - 'blender/**'
      - '.github/workflows/test-godot-blender.yml'
permissions:
  contents: read
jobs:
  native-2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb
      - name: Install Godot 4 headless
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Check Blender version and 2D asset authoring requirements
        run: |
          blender --version | head -n 1
          blender --background --factory-startup --python-expr "import bpy; print('Grease Pencil v3 available:', hasattr(bpy.data,'grease_pencils_v3'))"
          echo "Blender Grease Pencil v3 asset export requires Blender 4.3+; this runner may have an older version."
      - name: Render Godot 2D animation frames
        run: |
          mkdir -p output/godot-frames
          xvfb-run -a godot --path godot --rendering-driver opengl3 -- --action=brush --place=bathroom --frames=48 --out="$PWD/output/godot-frames"
          test "$(find output/godot-frames -name 'frame_*.png' | wc -l)" -eq 48
          file output/godot-frames/frame_00000.png
      - name: Encode and validate real MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i output/godot-frames/frame_%05d.png -c:v libx264 -pix_fmt yuv420p output/godot-demo.mp4
          test -s output/godot-demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 output/godot-demo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: godot-2d-demo-mp4
          path: output/godot-demo.mp4
          if-no-files-found: error
          retention-days: 3
