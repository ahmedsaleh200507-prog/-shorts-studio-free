name: Render Remotion 2D demo MP4
on:
  push:
    branches: [main]
    paths:
      - 'animation/**'
      - '.github/workflows/remotion-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remotion-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install video dependencies
        working-directory: animation
        run: npm install --no-audit --no-fund
      - name: Check scene planner
        working-directory: animation
        run: npm test
      - name: Download rendering browser
        working-directory: animation
        run: npx remotion browser ensure
      - name: Render real MP4 sample
        working-directory: animation
        run: |
          mkdir -p ../output
          npx remotion render entry.mjs ShortsDemo ../output/remotion-demo.mp4 --codec h264 --crf 27 --concurrency 1 --scale 0.5 --frames 0-47
      - name: Validate MP4 without external FFprobe
        run: |
          test -s output/remotion-demo.mp4
          node --input-type=module -e "
            import {readFileSync,statSync} from 'node:fs';
            const file='output/remotion-demo.mp4';
            const buf=readFileSync(file);
            if(statSync(file).size<10000) throw Error('MP4 too small');
            if(buf.toString('ascii',4,8)!=='ftyp') throw Error('Invalid MP4 header');
            if(!buf.includes(Buffer.from('moov'))) throw Error('MP4 metadata atom missing');
            if(!buf.includes(Buffer.from('mdat'))) throw Error('MP4 media atom missing');
            console.log('MP4 validated:',buf.length,'bytes');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-2d-demo-mp4
          path: output/remotion-demo.mp4
          if-no-files-found: error
          retention-days: 3
